# default configuration for waqfs/apple-music-rpc
[discord]
client_id = "1239490006054207550"
ping_interval_seconds = 15
reconnect_interval_seconds = 5

[activity]
details_format = "{title}"
state_format = "{artist}"
large_text_format = "{album}"

# templates:
# {title} - track title
# {artist} - track artist
# {album} - track album/collection

[apple_music]
artwork_resolution = 512
timeout_seconds = 5
query_results_limit = 20
