[package]
name = "apple-music-rpc"
version = "0.0.1"
edition = "2024"
description = "Apple Music RPC daemon for macOS"
repository = "https://github.com/waqfs/apple-music-rpc"
license = "GPL-3.0"

[dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["json"] }
